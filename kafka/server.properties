# Broker Kafka de un nodo en modo KRaft para desarrollo y demo del Museo Virtual.
# Es el config/kraft/server.properties de Kafka 3.7.0 reducido a lo necesario,
# con los ajustes para Windows del final.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093
listeners=PLAINTEXT://:9092,CONTROLLER://:9093
inter.broker.listener.name=PLAINTEXT
advertised.listeners=PLAINTEXT://localhost:9092
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

# Relativo al directorio desde donde se lanza: levantar-kafka.cmd lo lanza desde kafka\.
log.dirs=datos
num.partitions=3
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0

# --- Ajustes para Windows ---
# Kafka renombra y borra carpetas de segmentos con los archivos abiertos, algo que
# Windows no permite: el broker marca el directorio de datos como fallido y se apaga
# (lo comprobamos borrando un topic). Por eso no se borran topics, no se borran
# mensajes viejos y no se compacta. Para un entorno de desarrollo no tiene costo.
delete.topic.enable=false
log.retention.ms=-1
log.cleaner.enable=false
