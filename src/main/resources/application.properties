spring.application.name=museo
server.port=8000

# MariaDB / MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/museodb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=unla
spring.datasource.password=unla1234

# Hibernate JPA Config
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Limita la inspección de metadatos de Hibernate al catálogo museodb
spring.jpa.properties.hibernate.default_catalog=museodb
spring.jpa.properties.hibernate.default_schema=museodb

# Habilita la inicialización de scripts SQL
spring.sql.init.mode=always

# OBLIGATORIO: Espera a que Hibernate cree/actualice las tablas antes de ejecutar el SQL
spring.jpa.defer-datasource-initialization=true

# Especifica la ruta del archivo con las sentencias INSERT
spring.sql.init.data-locations=classpath:import.sql


# Logging Config
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG

# JWT Configuration
jwt.secret=test-secret-with-at-least-32-characters
jwt.expiration-ms=900000

# Frontend URL Configuration
app.frontend.url=http://localhost:3000