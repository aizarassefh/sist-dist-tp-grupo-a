syntax = "proto3";

package museo.gateway;

option java_multiple_files = true;
option java_package = "com.unla.museo.gateway.grpc";
option java_outer_classname = "GatewayProto";

import "catalogo.proto";
import "usuarios.proto";
import "eventos.proto";
import "recorridos.proto";
import "comparacion.proto";
import "recomendaciones.proto";
import "exploracion.proto";

// Servicio Aggregator de Gateway
// Este servicio expone métodos que orquestan múltiples servicios internos
service GatewayService {
  // Métodos de búsqueda compuesta
  rpc BusquedaGlobal(BusquedaGlobalRequest) returns (BusquedaGlobalResponse);

  // Dashboard personalizado
  rpc ObtenerDashboard(ObtenerDashboardRequest) returns (DashboardResponse);

  // Información detallada de obra enriquecida
  rpc ObtenerObraEnriquecida(ObtenerObraEnriquecidaRequest) returns (ObraEnriquecida);
}

// Mensajes compuestos que combinan datos de múltiples servicios
message BusquedaGlobalRequest {
  string termino = 1;
  repeated string tipos = 2; // "obras", "artistas", "eventos"
  int32 pagina = 3;
  int32 tamano = 4;
}

message BusquedaGlobalResponse {
  repeated ResultadoBusqueda resultados = 1;
  int32 total_obras = 2;
  int32 total_artistas = 3;
  int32 total_eventos = 4;
}

message ResultadoBusqueda {
  string tipo = 1; // "OBRA", "ARTISTA", "EVENTO"
  oneof entidad {
    museo.catalogo.Obra obra = 2;
    museo.catalogo.Artista artista = 3;
    museo.eventos.Evento evento = 4;
  }
  double relevancia = 5;
}

message ObtenerDashboardRequest {
  int64 usuario_id = 1;
  string rol = 2;
}

message DashboardResponse {
  // Datos del usuario
  museo.usuarios.Usuario usuario = 1;

  // Recomendaciones personalizadas
  repeated museo.recomendaciones.Recomendacion recomendaciones = 2;

  // Obras populares
  repeated museo.recomendaciones.ObraPopular populares = 3;

  // Próximos eventos
  repeated museo.eventos.Evento proximos_eventos = 4;

  // Estadísticas del catálogo
  museo.exploracion.EstadisticasCatalogo estadisticas = 5;

  // Recorridos guardados del usuario
  repeated museo.recorridos.Recorrido mis_recorridos = 6;

  // Exploración rápida
  museo.exploracion.EspacioArte espacio_exploracion = 7;
}

message ObtenerObraEnriquecidaRequest {
  int64 obra_id = 1;
  int64 usuario_id = 2;
}

message ObraEnriquecida {
  // Información base
  museo.catalogo.Obra obra = 1;

  // Obras relacionadas/similares
  repeated museo.catalogo.Obra obras_relacionadas = 2;

  // Comentarios (últimos)
  repeated museo.catalogo.Comentario comentarios_recientes = 3;

  // Obras del mismo artista
  repeated museo.catalogo.Obra obras_mismo_artista = 4;

  // Para comparación
  repeated museo.catalogo.Obra sugerencias_comparacion = 5;

  // Recomendaciones basadas en esta obra
  repeated museo.recomendaciones.Recomendacion recomendaciones_derivadas = 6;

  // Eventos relacionados
  repeated museo.eventos.Evento eventos_relacionados = 7;

  // Conexiones con otras obras
  repeated museo.exploracion.ConexionObra conexiones = 8;
}
