syntax = "proto3";

package museo.catalogo;

option java_multiple_files = true;
option java_package = "com.unla.museo.catalogo.grpc";
option java_outer_classname = "CatalogoProto";

// Servicio de dominio del catálogo: dueño de las tablas obras y artistas.
// Lo implementa el módulo catalogo del backend Java. Solo lectura: el alta de
// obras no es parte de la consigna, y la búsqueda de la Entrega 1 sigue por
// GraphQL; estas operaciones existen para los casos de uso de la Entrega 2.
service CatalogoService {
  // Obras que cumplen TODOS los criterios no vacíos. Dentro de cada lista,
  // alcanza con que coincida uno (OR). Comparación sin mayúsculas ni acentos;
  // técnica por "contiene" ("óleo" encuentra "Óleo sobre lienzo").
  rpc BuscarObras(BuscarObrasRequest) returns (ObrasResponse);

  // Obras por id, en el mismo orden pedido. Si falta alguna: NOT_FOUND.
  rpc ObtenerObras(ObtenerObrasRequest) returns (ObrasResponse);

  // Artistas, opcionalmente de un movimiento, con cuántas obras tiene cada uno.
  rpc ListarArtistas(ListarArtistasRequest) returns (ArtistasResponse);

  // Valores existentes de movimiento, técnica y temática, con su cantidad de
  // obras. Alimenta los selectores del front y el punto de partida de la
  // exploración.
  rpc ListarCategorias(ListarCategoriasRequest) returns (CategoriasResponse);
}

message Obra {
  int64 id = 1;
  string titulo = 2;
  string descripcion = 3;
  Artista artista = 4;
  int32 anio_creacion = 5;    // 0 si no se conoce
  string tecnica = 6;
  string tematica = 7;        // Retrato, Paisaje, Mitología, ...
  string movimiento = 8;      // Columna epoca: Renacimiento, Impresionismo, ...
  string dimensiones = 9;
  string ubicacion = 10;      // Sala del museo
  bool en_exhibicion = 11;
  string imagen_url = 12;
}

message Artista {
  int64 id = 1;
  string nombre = 2;
  string biografia = 3;
  string nacionalidad = 4;
  string movimiento = 5;
  int32 anio_nacimiento = 6;  // 0 si no se conoce
  int32 anio_fallecimiento = 7;
  int32 cantidad_obras = 8;   // Solo lo completa ListarArtistas
}

message BuscarObrasRequest {
  repeated string movimientos = 1;
  repeated string tecnicas = 2;
  repeated string tematicas = 3;
  bool solo_en_exhibicion = 4;
}

message ObtenerObrasRequest {
  repeated int64 ids = 1;
}

message ObrasResponse {
  repeated Obra obras = 1;
}

message ListarArtistasRequest {
  string movimiento = 1;      // Vacío: todos
}

message ArtistasResponse {
  repeated Artista artistas = 1;
}

message ListarCategoriasRequest {}

message Categoria {
  string nombre = 1;
  int32 cantidad_obras = 2;
}

message CategoriasResponse {
  repeated Categoria movimientos = 1;
  repeated Categoria tecnicas = 2;
  repeated Categoria tematicas = 3;
}
