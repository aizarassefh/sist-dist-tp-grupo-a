syntax = "proto3";

package museo.usuarios;

option java_multiple_files = true;
option java_package = "com.unla.museo.usuarios.grpc";
option java_outer_classname = "UsuariosProto";

// Servicio de dominio de usuarios/visitantes: dueño de las preferencias y de
// las interacciones. Lo implementa el backend Java, sobre el usuario de la
// Entrega 1. Los usuarios se identifican por email porque es lo que viaja en
// el JWT (claim sub): el gateway no conoce los ids internos.
service UsuariosService {
  // Usuario y sus preferencias. NOT_FOUND si el email no existe.
  rpc ObtenerPerfil(PerfilRequest) returns (Perfil);

  // Reemplaza las preferencias completas del usuario.
  rpc ActualizarPreferencias(ActualizarPreferenciasRequest) returns (Perfil);

  // Registra que el usuario vio una obra o la marcó como de interés.
  // NOT_FOUND si el usuario no existe. No valida la obra: guarda solo su id,
  // porque la tabla obras es del catálogo; el gateway la verifica antes con
  // CatalogoService.ObtenerObras.
  rpc RegistrarInteraccion(RegistrarInteraccionRequest) returns (Interaccion);

  // Interacciones del usuario, la más reciente primero.
  rpc ListarInteracciones(PerfilRequest) returns (InteraccionesResponse);
}

message Preferencias {
  repeated string movimientos = 1;
  repeated string tecnicas = 2;
  repeated string tematicas = 3;
}

message Perfil {
  int64 id = 1;
  string email = 2;
  string nombre = 3;
  string apellido = 4;
  string rol = 5;             // VISITANTE | CURADOR | ADMINISTRADOR
  Preferencias preferencias = 6;
}

message PerfilRequest {
  string email = 1;
}

message ActualizarPreferenciasRequest {
  string email = 1;
  Preferencias preferencias = 2;
}

message RegistrarInteraccionRequest {
  string email = 1;
  int64 obra_id = 2;
  string tipo = 3;            // VISTA | INTERES
}

message Interaccion {
  int64 obra_id = 1;
  string tipo = 2;
  string fecha = 3;           // ISO 8601 local
}

message InteraccionesResponse {
  repeated Interaccion interacciones = 1;
}
