syntax = "proto3";

package museo.exploracion;

option java_multiple_files = true;
option java_package = "com.unla.museo.exploracion.grpc";
option java_outer_classname = "ExploracionProto";

import "catalogo.proto";

// Servicio de Exploración Interactiva del Catálogo
service ExploracionService {
  // Navegación por el espacio del arte (visualización-inmersión)
  rpc ExplorarEspacio(ExplorarEspacioRequest) returns (ExplorarEspacioResponse);

  // Descubrimiento con filtros dinámicos
  rpc DescubrirObras(DescubrirObrasRequest) returns (DescubrirObrasResponse);

  // Cronología interactiva
  rpc ExplorarCronologia(ExplorarCronologiaRequest) returns (ExplorarCronologiaResponse);

  // Conexiones entre obras (grafo de relaciones)
  rpc ObtenerConexionesObras(ObtenerConexionesRequest) returns (ConexionesObrasResponse);

  // Estadísticas del catálogo
  rpc ObtenerEstadisticas(ObtenerEstadisticasRequest) returns (EstadisticasCatalogo);
}

// Mensajes
message EspacioArte {
  repeated ClusterObras clusters = 1;
  repeated museo.catalogo.Artista artistas_destacados = 2;
  repeated EstiloPopular estilos = 3;
  repeated EpocaArte epocas = 4;
}

message ClusterObras {
  string id = 1;
  string nombre = 2;
  string categoria = 3; // "estilo", "tecnica", "epoca", "tema"
  repeated museo.catalogo.Obra obras_muestra = 4;
  int32 total_obras = 5;
  double x = 6; // Coordenada para visualización
  double y = 7;
  string color = 8; // Color representativo
}

message EstiloPopular {
  string nombre = 1;
  int32 cantidad_obras = 2;
  int32 periodo_inicio = 3;
  int32 periodo_fin = 4;
  string descripcion = 5;
}

message EpocaArte {
  string nombre = 1;
  string rango_anios = 2;
  int32 cantidad_obras = 3;
  repeated string estilos_predominantes = 4;
}

message FiltroDinamico {
  string campo = 1; // "estilo", "tecnica", "anio", "artista", "calificacion"
  string operador = 2; // "eq", "gt", "lt", "between", "in"
  string valor = 3;
  string valor_secundario = 4; // Para "between"
}

message CronologiaItem {
  string periodo = 1;
  int32 anio_inicio = 2;
  int32 anio_fin = 3;
  repeated museo.catalogo.Obra obras_destacadas = 4;
  repeated string hechos_relevantes = 5;
  int32 cantidad_obras = 6;
}

message ConexionObra {
  int64 obra_origen_id = 1;
  int64 obra_destino_id = 2;
  string tipo_conexion = 3; // "MISMO_ESTILO", "MISMO_ARTISTA", "INFLUENCIA", "CONTEMPORANEAS", "TECNICA_SIMILAR"
  double fuerza = 4; // 0-1
  string descripcion = 5;
}

message EstadisticasCatalogo {
  int32 total_obras = 1;
  int32 total_artistas = 2;
  repeated EstiloCount estilos = 3;
  repeated TecnicaCount tecnicas = 4;
  repeated RangoAnios periodos = 5;
  double calificacion_promedio_global = 6;
  int32 total_comentarios = 7;
}

message EstiloCount {
  string estilo = 1;
  int32 cantidad = 2;
  double porcentaje = 3;
}

message TecnicaCount {
  string tecnica = 1;
  int32 cantidad = 2;
}

message RangoAnios {
  string rango = 1;
  int32 cantidad = 2;
}

// Requests y Responses
message ExplorarEspacioRequest {
  string modo = 1; // "ESTILOS", "ARTISTAS", "CRONOLOGIA", "TECNICAS"
  int64 usuario_id = 2; // Para personalizar la vista
}

message ExplorarEspacioResponse {
  EspacioArte espacio = 1;
  repeated string sugerencias_navegacion = 2;
}

message DescubrirObrasRequest {
  repeated FiltroDinamico filtros = 1;
  string ordenar_por = 2;
  bool orden_descendente = 3;
  int32 pagina = 4;
  int32 tamano = 5;
}

message DescubrirObrasResponse {
  repeated museo.catalogo.Obra obras = 1;
  int32 total = 2;
  repeated FiltroDinamico filtros_aplicados = 3;
  repeated string sugerencias_filtros = 4; // Filtros recomendados basados en resultados
}

message ExplorarCronologiaRequest {
  int32 anio_inicio = 1;
  int32 anio_fin = 2;
  string filtro_estilo = 3;
  int64 usuario_id = 4;
}

message ExplorarCronologiaResponse {
  repeated CronologiaItem items = 1;
  string linea_tematica_detectada = 2;
}

message ObtenerConexionesRequest {
  int64 obra_id = 1;
  int32 profundidad = 2; // Niveles de conexión a seguir (1-3)
  string tipo_filtro = 3; // Opcional: solo ciertos tipos
}

message ConexionesObrasResponse {
  repeated ConexionObra conexiones = 1;
  repeated museo.catalogo.Obra obras_relacionadas = 2;
  int32 obras_totales_conectadas = 3;
}

message ObtenerEstadisticasRequest {
  bool incluir_distribucion = 1;
  bool incluir_tendencias = 2;
  string filtro_estilo = 3;
}
