syntax = "proto3";

package museo.recorridos;

option java_multiple_files = true;
option java_package = "com.unla.museo.recorridos.grpc";
option java_outer_classname = "RecorridosProto";

import "catalogo.proto";

// Servicio de Recorridos Guiados Personalizados
service RecorridosService {
  // Generar recorrido personalizado
  rpc GenerarRecorrido(GenerarRecorridoRequest) returns (Recorrido);

  // Gestión de recorridos guardados
  rpc GuardarRecorrido(GuardarRecorridoRequest) returns (Recorrido);
  rpc ObtenerRecorrido(ObtenerRecorridoRequest) returns (Recorrido);
  rpc ListarRecorridosUsuario(ListarRecorridosRequest) returns (ListarRecorridosResponse);
  rpc EliminarRecorrido(EliminarRecorridoRequest) returns (EliminarRecorridoResponse);
}

// Mensajes
message Recorrido {
  int64 id = 1;
  string nombre = 2;
  string descripcion = 3;
  int64 usuario_id = 4;
  repeated ParadaRecorrido paradas = 5;
  int32 duracion_estimada_minutos = 6;
  double distancia_total_metros = 7;
  string tema = 8; // Estilo predominante (Impresionismo, Contemporáneo, etc.)
  string fecha_creacion = 9;
  bool compartible = 10;
}

message ParadaRecorrido {
  int32 orden = 1;
  museo.catalogo.Obra obra = 2;
  int32 tiempo_sugerido_minutos = 3; // Tiempo sugerido en cada obra
  string notas = 4; // Información adicional para esta parada
}

message CriteriosRecorrido {
  // Tipo de recorrido a generar
  enum TipoRecorrido {
    TIPO_NO_ESPECIFICADO = 0;
    POR_ESTILO = 1;           // Recorrido temático por estilo
    POR_ARTISTA = 2;          // Obras de un artista específico
    POR_EPOCA = 3;            // Obras de una época/periodo
    POR_DURACION = 4;         // Recorrido de duración específica
    PERSONALIZADO = 5;        // Basado en preferencias del usuario
  }

  TipoRecorrido tipo = 1;
  string estilo = 2;           // Para TIPO_POR_ESTILO
  int64 artista_id = 3;       // Para TIPO_POR_ARTISTA
  string fecha_inicio = 4;     // Para TIPO_POR_EPOCA (ISO 8601)
  string fecha_fin = 5;        // Para TIPO_POR_EPOCA (ISO 8601)
  int32 duracion_minutos = 6;  // Para TIPO_POR_DURACION (ej. 30, 60, 90)
  int64 usuario_id = 7;        // Para PERSONALIZADO (usar preferencias del usuario)
  int32 cantidad_maxima_obras = 8; // Opcional, default 10
}

// Requests y Responses
message GenerarRecorridoRequest {
  int64 usuario_id = 1;
  CriteriosRecorrido criterios = 2;
  string nombre_personalizado = 3; // Opcional
  bool guardar_automaticamente = 4;
}

message GuardarRecorridoRequest {
  int64 usuario_id = 1;
  string nombre = 2;
  string descripcion = 3;
  repeated ParadaRecorrido paradas = 4;
  string tema = 5;
  bool compartible = 6;
}

message ObtenerRecorridoRequest {
  int64 recorrido_id = 1;
  int64 usuario_id = 2; // Para validar acceso
}

message ListarRecorridosRequest {
  int64 usuario_id = 1;
  int32 pagina = 2;
  int32 tamano = 3;
}

message ListarRecorridosResponse {
  repeated Recorrido recorridos = 1;
  int32 total = 2;
}

message EliminarRecorridoRequest {
  int64 recorrido_id = 1;
  int64 usuario_id = 2;
}

message EliminarRecorridoResponse {
  bool exito = 1;
  string mensaje = 2;
}
