syntax = "proto3";

package museo.eventos;

option java_multiple_files = true;
option java_package = "com.unla.museo.eventos.grpc";
option java_outer_classname = "EventosProto";

// Servicio de dominio de eventos: dueño de las tablas eventos e inscripciones.
// Lo implementa el módulo eventos del backend Java. Solo lectura: la gestión
// de eventos e inscripciones sigue por REST (Entrega 1).
service EventosService {
  // Eventos vinculados a un movimiento artístico, por fecha ascendente.
  rpc ListarEventosPorMovimiento(EventosPorMovimientoRequest) returns (EventosResponse);

  // Eventos a los que se inscribió un usuario (señal de interés para las
  // recomendaciones).
  rpc ListarEventosDeUsuario(EventosDeUsuarioRequest) returns (EventosResponse);
}

message Evento {
  int64 id = 1;
  string titulo = 2;
  string descripcion = 3;
  string tipo = 4;            // VISITA_GUIADA | TALLER | CHARLA
  string fecha_hora = 5;      // ISO 8601 local, ej. 2026-11-05T18:00:00
  int32 duracion_minutos = 6;
  int32 cupo_maximo = 7;
  int32 inscriptos = 8;
  string movimiento = 9;      // Vacío si el evento no está vinculado a uno
}

message EventosPorMovimientoRequest {
  string movimiento = 1;
  bool solo_futuros = 2;
}

message EventosDeUsuarioRequest {
  string email = 1;
}

message EventosResponse {
  repeated Evento eventos = 1;
}
