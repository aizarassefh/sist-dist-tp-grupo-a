server:
  port: 8080

spring:
  application:
    name: museo-gateway
  main:
    web-application-type: reactive
  codec:
    max-in-memory-size: 10MB

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Mismo secreto (y mismo default de desarrollo) que api-rest-graphql: el gateway
# valida los tokens que emite el backend, no emite los suyos.
jwt:
  secret: ${JWT_SECRET:clave-de-desarrollo-museo-virtual-no-usar-en-produccion}

gateway:
  grpc:
    # Plazo máximo de cada llamada gRPC; vencido, el pedido responde 503.
    deadline-ms: ${GRPC_DEADLINE_MS:5000}

# Clientes gRPC. Catálogo, eventos y usuarios los atiende el mismo proceso Java
# (un canal por servicio para poder apuntarlos a lugares distintos); el motor
# es el servicio NestJS.
grpc:
  client:
    catalogo:
      address: static://${BACKEND_GRPC:localhost:9090}
      negotiation-type: plaintext
    eventos:
      address: static://${BACKEND_GRPC:localhost:9090}
      negotiation-type: plaintext
    usuarios:
      address: static://${BACKEND_GRPC:localhost:9090}
      negotiation-type: plaintext
    motor:
      address: static://${MOTOR_GRPC:localhost:9091}
      negotiation-type: plaintext

spring.cloud.gateway:
  # Proxy hacia el backend de la Entrega 1. No hay rutas para /api/v2/**: esas
  # las atienden los controllers del gateway, y el filtro de seguridad responde
  # 404 a cualquier /api/v2/** que no exista para que /api/** no se las lleve.
  routes:
    - id: spring-boot-api
      uri: http://${SPRING_BOOT_HOST:localhost}:${SPRING_BOOT_PORT:8000}
      predicates:
        - Path=/api/**
      filters:
        - StripPrefix=0

    - id: graphql-route
      uri: http://${SPRING_BOOT_HOST:localhost}:${SPRING_BOOT_PORT:8000}
      predicates:
        - Path=/graphql/**
      filters:
        - StripPrefix=0

    - id: graphiql-route
      uri: http://${SPRING_BOOT_HOST:localhost}:${SPRING_BOOT_PORT:8000}
      predicates:
        - Path=/graphiql/**
      filters:
        - StripPrefix=0

    - id: swagger-route
      uri: http://${SPRING_BOOT_HOST:localhost}:${SPRING_BOOT_PORT:8000}
      predicates:
        - Path=/swagger-ui.html,/v3/api-docs/**,/swagger-ui/**
      filters:
        - StripPrefix=0

  # CORS de las rutas proxy. El de /api/v2/** lo resuelve ConfiguracionCors.
  globalcors:
    cors-configurations:
      '[/**]':
        allowed-origins:
          - "http://localhost:5173"
          - "http://localhost:3000"
          - "${FRONTEND_URL:http://localhost:5173}"
        allowed-methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        allowed-headers:
          - "*"
        allow-credentials: true
        max-age: 3600

logging:
  level:
    com.unla.museo.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    io.grpc: INFO
