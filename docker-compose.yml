# Base de datos para desarrollo y para la demo.
#   docker compose up -d      levanta MariaDB en el puerto 3306
#   docker compose down       la apaga (los datos quedan en el volumen)
#   docker compose down -v    la apaga y borra los datos
# Usuario, clave y base coinciden con los valores por defecto de
# api-rest-graphql/src/main/resources/application.properties.
services:
  mariadb:
    image: mariadb:11.4
    container_name: museo-mariadb
    environment:
      MARIADB_DATABASE: museodb
      MARIADB_USER: museo
      MARIADB_PASSWORD: museo
      MARIADB_ROOT_PASSWORD: museo-root
    ports:
      - "${DB_PUERTO:-3306}:3306"
    volumes:
      - museo-datos:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Broker opcional para novedades del backend. Es un nodo KRaft único, sin Zookeeper.
  kafka:
    image: apache/kafka:3.7.0
    container_name: museo-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    ports:
      - "${KAFKA_PUERTO:-9092}:9092"
    volumes:
      - museo-kafka:/tmp/kraft-combined-logs

volumes:
  museo-datos:
  museo-kafka:
