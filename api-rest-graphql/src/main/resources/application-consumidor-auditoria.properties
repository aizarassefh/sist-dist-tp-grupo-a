# Proceso consumidor de auditoría (docs/contrato-mensajeria.md). Se lanza con
# --spring.profiles.active=consumidor-auditoria, que reemplaza al perfil "local".
# La base y el broker salen de application.properties (DB_URL, DB_USUARIO,
# DB_CLAVE, KAFKA_BOOTSTRAP_SERVERS). Hay que levantar el proceso principal
# primero: es el que crea el esquema.
spring.main.web-application-type=none
grpc.server.port=-1
app.datos-de-ejemplo=false
spring.jpa.hibernate.ddl-auto=none
app.kafka.publicador.enabled=false
app.kafka.consumidores=auditoria
