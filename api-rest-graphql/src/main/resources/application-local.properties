spring.application.name=museo
server.port=8000

# Base de datos: MariaDB. Los valores por defecto coinciden con el
# docker-compose.yml de la raíz: para desarrollo alcanza con levantarlo.
# En otro entorno se pasan con las variables DB_URL, DB_USUARIO y DB_CLAVE.
spring.datasource.url=jdbc:mysql://localhost:3306/museodb
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false


jwt.secret=${JWT_SECRET:clave-de-desarrollo-museo-virtual-no-usar-en-produccion}
jwt.expiration-ms=${JWT_EXPIRACION_MS:3600000}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

spring.graphql.http.path=/graphql
spring.graphql.graphiql.enabled=true

springdoc.api-docs.version=openapi_3_0

app.datos-de-ejemplo=true

