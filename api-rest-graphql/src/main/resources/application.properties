spring.profiles.active=local
spring.application.name=museo
server.port=8000

# Base de datos: MariaDB. Los valores por defecto coinciden con el
# docker-compose.yml de la raiz: para desarrollo alcanza con levantarlo.
# En otro entorno se pasan con las variables DB_URL, DB_USUARIO y DB_CLAVE.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/museodb}
spring.datasource.username=${DB_USUARIO:museo}
spring.datasource.password=${DB_CLAVE:museo}

# Hibernate crea y actualiza las tablas a partir de las entidades. Los roles,
# los usuarios de prueba y los datos de ejemplo los carga DataInitializer.
spring.jpa.hibernate.ddl-auto=update
# Las respuestas se arman con DTOs dentro de la transaccion del servicio;
# sin esto, una relacion lazy se consultara al serializar la respuesta.
spring.jpa.open-in-view=false

# Configuracion de gRPC Server
grpc.server.port=9090
grpc.server.enable-keep-alive=true
grpc.server.keep-alive-time=300
grpc.server.keep-alive-timeout=60

# Clave de firma del JWT. El valor por defecto es solo para desarrollo: en
# cualquier otro entorno se pasa con la variable JWT_SECRET (32 caracteres o mas).
jwt.secret=${JWT_SECRET:clave-de-desarrollo-museo-virtual-no-usar-en-produccion}
jwt.expiration-ms=${JWT_EXPIRACION_MS:3600000}

# Origen del frontend permitido por CORS.
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# GraphQL con su documentacion interactiva en /graphiql.
spring.graphql.http.path=/graphql
spring.graphql.graphiql.enabled=true

# La consigna pide OpenAPI 3.0; springdoc genera 3.1 si no se le indica.
springdoc.api-docs.version=openapi_3_0

# Carga usuarios de prueba y eventos de ejemplo al arrancar (los roles se
# crean siempre). En false para un entorno con datos reales.
app.datos-de-ejemplo=true

# Mensajería con Kafka (docs/contrato-mensajeria.md). El proceso principal
# publica el outbox; los consumidores se lanzan aparte con su perfil
# (consumidor-notificaciones, consumidor-auditoria) y se activan con
# app.kafka.consumidores. APP_KAFKA_ENABLED=false permite correr sin broker:
# las novedades quedan pendientes en mensajes_salientes.
app.kafka.enabled=${APP_KAFKA_ENABLED:true}
app.kafka.topic=${APP_KAFKA_TOPIC:eventos.novedades}
app.kafka.publicador.enabled=true
app.kafka.consumidores=
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000

# Cliente gRPC hacia el backend: el consumidor de notificaciones le pregunta
# qué visitantes tienen un movimiento entre sus preferidos.
grpc.client.usuarios.address=static://${BACKEND_GRPC:localhost:9090}
grpc.client.usuarios.negotiation-type=plaintext
