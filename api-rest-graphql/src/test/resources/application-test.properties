# Perfil de los tests: H2 en memoria, para correrlos sin MariaDB ni Docker.
spring.datasource.url=jdbc:h2:mem:museo-test;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.hibernate.ddl-auto=create-drop

# Solo en test: habilita las estadísticas de Hibernate para el test de
# eficiencia del catálogo (cuenta sentencias SQL con SessionFactory#getStatistics()).
spring.jpa.properties.hibernate.generate_statistics=true

# Los tests levantan varios contextos de Spring y cada uno abriria el 9090:
# el segundo falla al bindear y su create-drop vacia la H2 compartida.
grpc.server.port=-1

# Los tests de la Entrega 1 asumen exactamente las 9 obras originales: las 9
# obras ampliadas de la Entrega 2 quedan afuera en este perfil.
app.datos-de-ejemplo-ampliados=false
